const folderList=[['Posteingang','inbox'],['Favoriten','star'],['Ungelesene E-Mails','mail'],['Papierkorb','trash'],['Spamverdacht','ban'],['Gesendet','send'],['Entwürfe','edit'],['Postausgang','send'],['Bewerbung','folder'],['Elster','folder'],['Vattenfall','folder'],['Archiv','archive']];function renderFolders(){$('folders').replaceChildren();for(const [name,icon] of folderList){const row=document.createElement('button');row.className='folderrow'+(name===folder?' active':'');row.innerHTML=iconSvg(icon);const label=document.createElement('span');label.textContent=name;row.append(label);let n=emails.filter(m=>name==='Favoriten'?m.starred:name==='Ungelesene E-Mails'?!m.read:m.folder===name).length;if(n){const count=document.createElement('span');count.className='num';count.textContent=n;row.append(count)}row.onclick=()=>{folder=name;closeDrawer();show('home');render()};$('folders').append(row)}}function render(){const q=$('search').value.toLowerCase().trim();$('folderTitle').innerHTML='';$('folderTitle').append(document.createTextNode(folder+' '));const caret=document.createElement('span');caret.textContent='⌄';$('folderTitle').append(caret);$('updated').textContent='Aktualisiert: '+new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date());$('tabs').classList.toggle('hidden',folder!=='Posteingang');$('newsletter').classList.toggle('hidden',folder!=='Posteingang'||tab!=='Allgemein');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('selected',t.dataset.tab===tab));const rows=emails.filter(m=>(folder==='Favoriten'?m.starred:folder==='Ungelesene E-Mails'?!m.read:m.folder===folder)&&(folder!=='Posteingang'||m.category===tab)&&(!unreadOnly||!m.read)&&[m.from,m.email,m.subject,m.body].some(s=>String(s||'').toLowerCase().includes(q))).sort((a,b)=>stamp(b.timestamp)-stamp(a.timestamp));$('newCount').textContent=emails.filter(m=>m.folder==='Posteingang'&&!m.read).length+' neue';$('list').replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Keine E-Mails vorhanden';$('list').append(empty)}for(const m of rows){const row=document.createElement('article');row.className='mail'+(!m.read?' unread':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(m.from||'?').trim().charAt(0).toUpperCase();const content=document.createElement('div');content.className='mailmain';content.tabIndex=0;content.setAttribute('role','button');content.setAttribute('aria-label','E-Mail öffnen: '+m.subject);content.innerHTML='<div class="mailhead"><span class="sender"></span><span class="date"></span></div><div class="subject"></div><div class="preview"></div>';content.querySelector('.sender').textContent=m.from;content.querySelector('.date').textContent=fmt(m.timestamp);content.querySelector('.subject').textContent=m.subject;content.querySelector('.preview').textContent=m.body;content.onclick=()=>openMail(m.id);content.onkeydown=e=>{if(e.key==='Enter')openMail(m.id)};const star=document.createElement('button');star.className='star'+(m.starred?' active':'');star.textContent=m.starred?'★':'☆';star.setAttribute('aria-label','Favorit umschalten');star.onclick=()=>{m.starred=!m.starred;save();render()};row.append(avatar,content,star);$('list').append(row)}renderFolders()}
function openMail(id){active=emails.find(m=>m.id===id);if(!active)return;active.read=true;save();$('detailSubject').textContent=active.subject;$('detailMeta').textContent='Von: '+active.from+' <'+active.email+'>\nDatum: '+new Intl.DateTimeFormat('de-DE',{dateStyle:'full',timeStyle:'short'}).format(new Date(active.timestamp));$('detailBody').textContent=active.body;$('mark').textContent='Als ungelesen markieren';show('detail')}function edit(newMail=false){creating=newMail;if(newMail)active={id:Date.now(),from:'',email:'',subject:'',body:'',timestamp:new Date().toISOString(),read:false,folder:'Entwürfe',category:'Allgemein',starred:false};if(!active)return;$('editTitle').textContent=newMail?'Neue Nachricht':'E-Mail bearbeiten';for(const [field,key] of [['editFrom','from'],['editEmail','email'],['editSubject','subject'],['editBody','body']])$(field).value=active[key]||'';$('editCategory').value=active.category||'Allgemein';const d=new Date(active.timestamp);$('editTimestamp').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);show('editor')}
$('editForm').onsubmit=e=>{e.preventDefault();Object.assign(active,{from:$('editFrom').value.trim(),email:$('editEmail').value.trim(),subject:$('editSubject').value.trim(),body:$('editBody').value,category:$('editCategory').value,timestamp:new Date($('editTimestamp').value).toISOString()});if(creating)emails.push(active);save();openMail(active.id);toast('Gespeichert')};$('edit').onclick=()=>edit();$('compose').onclick=()=>edit(true);$('cancelEdit').onclick=()=>creating?show('home'):show('detail');$('back').onclick=()=>{show('home');render()};$('mark').onclick=()=>{active.read=!active.read;save();$('mark').textContent=active.read?'Als ungelesen markieren':'Als gelesen markieren'};$('delete').onclick=()=>{active.folder='Papierkorb';save();show('home');render();toast('In den Papierkorb verschoben')};$('filter').onclick=()=>{unreadOnly=!unreadOnly;toast(unreadOnly?'Nur ungelesene Nachrichten':'Alle Nachrichten');render()};$('searchToggle').onclick=()=>{$('searchbox').classList.toggle('hidden');if(!$('searchbox').classList.contains('hidden'))$('search').focus()};$('search').oninput=render;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render()});function openDrawer(){$('shade').classList.remove('hidden');$('drawer').classList.remove('hidden')}function closeDrawer(){$('shade').classList.add('hidden');$('drawer').classList.add('hidden')}$('menu').onclick=openDrawer;$('accountBtn').onclick=openDrawer;$('shade').onclick=closeDrawer;$('closeDrawer').onclick=closeDrawer;$('navMail').onclick=()=>{folder='Posteingang';show('home');render()};for(const id of ['navFiles','navMobile','navNews'])$(id).onclick=()=>toast('Dieser Bereich ist noch nicht eingerichtet');$('settings').onclick=()=>{closeDrawer();toast('Nachrichten werden nur in diesem Browser gespeichert')};render();
</script></body></html>
