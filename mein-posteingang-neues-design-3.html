<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Mein Posteingang</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#26292c;font-family:Roboto,'Arial',sans-serif;font-size:16px}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100dvh;background:white}.header{height:110px;display:flex;align-items:center;gap:21px;padding:17px 20px 8px}.iconbtn{border:0;background:none;padding:6px;color:#1e2529;font-size:28px;line-height:1}.titlearea{flex:1;min-width:0}.heading{font-size:25px;font-weight:400;white-space:nowrap}.updated{font-size:13px;color:#686868;margin-top:6px}.profile,.avatar{background:#b6e1f7;color:#1674a6;border-radius:50%;display:grid;place-items:center;font-weight:400}.profile{width:43px;height:43px;flex-shrink:0;font-size:23px;border:0}.tabs{display:flex;gap:25px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #d3d3d3;padding:0 20px}.tab{background:none;border:0;padding:17px 0 20px;font-size:19px;color:#242424;position:relative}.tab.active{color:#1179b3}.tab.active:after{content:'';height:4px;background:#0781c5;border-radius:4px 4px 0 0;position:absolute;bottom:0;left:0;right:0}.mail-list{padding-bottom:105px}.mail{width:100%;display:flex;text-align:left;gap:13px;padding:16px 19px 18px;border:0;background:#fff;min-height:112px;color:inherit}.mail:active{background:#f2f8fc}.avatar{width:45px;height:45px;flex:0 0 45px;font-size:23px}.mail-content{min-width:0;flex:1}.mail-top{display:flex;align-items:baseline;gap:8px}.sender{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.date{font-size:12px;color:#666;white-space:nowrap}.subject{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.unread .subject{font-weight:700;color:#1176aa}.unread .sender{font-weight:700}.preview{color:#9a9a9a;font-size:16px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{border:0;background:none;color:#b7b7b7;font-size:27px;padding:0 0 0 7px;align-self:end}.star.on{color:#e5ac19}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;background:#f8f8f8;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:12px 0 max(12px,env(safe-area-inset-bottom));z-index:5}.navitem{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#777;font-size:12px;min-width:65px}.navitem .glyph{font-size:27px}.navitem.active{color:#137bad}.fab{position:fixed;bottom:94px;right:max(20px,calc((100vw - 720px)/2 + 20px));border:0;background:#0782d0;color:white;border-radius:18px;width:70px;height:70px;box-shadow:0 4px 15px #0003;font-size:36px;z-index:4}.drawerShade{position:fixed;inset:0;background:#0009;z-index:8}.drawer{position:fixed;top:0;bottom:0;left:max(0px,calc((100vw - 720px)/2));width:min(81vw,390px);background:white;z-index:9;overflow:auto}.drawerTitle{padding:50px 20px 24px;font-size:26px}.drawerTitle b{font-weight:600;color:#183d53}.account{display:flex;gap:17px;align-items:center;padding:12px 20px 24px;border-bottom:1px solid #ddd}.account .profile{width:56px;height:56px}.accountName{font-size:18px}.accountEmail{font-size:14px;color:#999;margin-top:7px}.groupLabel{padding:18px 20px;color:#999;border-bottom:1px solid #eee}.folder{display:flex;align-items:center;gap:20px;width:100%;border:0;background:white;text-align:left;padding:17px 23px;font-size:19px;color:#272b30}.folder.active{background:#cbe5f7;color:#126fa1}.folder .fi{width:30px;font-size:24px}.folder .count{margin-left:auto;font-size:15px;color:#34617a}.section{padding:20px 22px 110px}.back{background:none;border:0;font-size:18px;color:#137cad;padding:10px 0}.detailSubject{font-size:23px;margin:22px 0}.meta{font-size:14px;color:#626262;line-height:1.7;overflow-wrap:anywhere}.bodytext{white-space:pre-wrap;line-height:1.65;margin:30px 0}.actionRow{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:8px;padding:12px 16px;background:#0782c6;color:white}.secondary{background:#e9f5fc;color:#1475a9}.editform{display:grid;gap:15px;margin-top:20px}.editform label{display:grid;gap:6px;font-size:14px}.editform input,.editform textarea,.search{width:100%;border:1px solid #c9d4dd;border-radius:8px;padding:12px;color:#222;background:white}.editform textarea{min-height:160px}.searchbar{padding:12px 20px}.hidden{display:none!important}.empty{padding:50px 20px;text-align:center;color:#777}.smallnote{font-size:13px;color:#777}.menuMore{font-size:20px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#263d4c;color:#fff;padding:12px 18px;border-radius:9px;z-index:12;max-width:90%;font-size:13px}
</style></head><body><main class="app"><section id="home"><header class="header"><button class="iconbtn" id="menu" aria-label="Menü">☰</button><div class="titlearea"><div class="heading" id="folderTitle">Posteingang⌄</div><div class="updated" id="updated"></div></div><button class="iconbtn" id="searchToggle" aria-label="Suchen">⌕</button><button class="profile" id="accountBtn">P</button></header><div id="searchbar" class="searchbar hidden"><input id="search" class="search" placeholder="E-Mails durchsuchen"></div><div class="tabs" id="tabs"><button class="tab active" data-tab="Allgemein">Allgemein</button><button class="tab" data-tab="Newsletter">Newsletter</button><button class="tab" data-tab="Bestellungen">Bestellungen</button></div><div id="list" class="mail-list"></div><button class="fab" id="compose" aria-label="E-Mail schreiben">✎</button></section><section id="detail" class="section hidden"><button class="back" id="back">‹ Zurück</button><h2 id="detailSubject" class="detailSubject"></h2><div id="detailMeta" class="meta"></div><div id="detailBody" class="bodytext"></div><div class="actionRow"><button id="edit" class="primary">✎ Bearbeiten</button><button id="mark" class="secondary">Als ungelesen markieren</button><button id="delete" class="secondary">Papierkorb</button></div></section><section id="editor" class="section hidden"><button class="back" id="cancelEdit">‹ Zurück</button><h2 id="editTitle">E-Mail bearbeiten</h2><form id="editForm" class="editform"><label>Name des Absenders<input id="editFrom" required></label><label>E-Mail-Adresse<input id="editEmail" type="email" required></label><label>Betreff<input id="editSubject" required></label><label>Datum und Uhrzeit<input id="editTimestamp" type="datetime-local" required></label><label>Nachricht<textarea id="editBody" required></textarea></label><button class="primary" type="submit">Speichern</button></form></section><footer class="bottom"><button class="navitem active" id="navMail"><span class="glyph">▤</span>E-Mail</button><button class="navitem" id="navFiles"><span class="glyph">▧</span>Fotos/Dateien</button><button class="navitem" id="navMobile"><span class="glyph">➤</span>Mobile</button><button class="navitem" id="navNews"><span class="glyph">▣</span>News</button></footer></main><div id="shade" class="drawerShade hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawerTitle"><b>GMX</b> FreeMail</div><div class="account"><div class="profile">P</div><div><div class="accountName" id="accountName">Mein Konto</div><div class="accountEmail" id="accountEmail">Lokaler Posteingang</div></div></div><div class="groupLabel">Ordner ⌄</div><div id="folders"></div><div class="groupLabel">Einstellungen</div><button class="folder" id="settings"><span class="fi">⚙</span>Einstellungen</button></aside><div id="toast" class="toast hidden"></div><script>
const testEmails=[{id:1,from:'Anna Müller',email:'anna.mueller@example.com',subject:'Frage zu unserem Termin',body:'Hallo! Können wir unseren Termin auf morgen verschieben?',timestamp:'2026-11-11T14:32:00+01:00',read:false},{id:2,from:'Max Schneider',email:'max.schneider@example.com',subject:'Projekt-Update',body:'Gute Neuigkeiten! Die ersten Aufgaben sind erledigt.',timestamp:'2026-11-11T10:15:00+01:00',read:false},{id:3,from:'Lisa Weber',email:'lisa.weber@example.com',subject:'Vielen Dank! ❤️',body:'Ich wollte mich noch einmal für deine Hilfe bedanken.',timestamp:'2026-11-10T18:47:00+01:00',read:true},{id:4,from:'Kundenservice',email:'service@example.com',subject:'Deine Anfrage wurde bearbeitet',body:'Wir haben deine Nachricht erhalten und bearbeitet.',timestamp:'2026-11-09T09:21:00+01:00',read:true},{id:5,from:'Thomas Becker',email:'thomas.becker@example.com',subject:'Eine kurze Frage',body:'Hallo, hast du diese Woche kurz Zeit für ein Gespräch?',timestamp:'2026-11-07T16:05:00+01:00',read:true}];

const $=id=>document.getElementById(id);
function readJSON(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
const oldEdits=readJSON('mail-edits-v1',{}),oldRead=readJSON('mail-demo-read',{}),oldIncoming=readJSON('mail-demo-incoming-v1',[]);
let emails=readJSON('mail-gmx-style-v3',null);
if(!Array.isArray(emails)){emails=[...testEmails.map(m=>({...m,...(oldEdits[m.id]||{}),read:typeof oldRead[m.id]==='boolean'?oldRead[m.id]:m.read})),...(Array.isArray(oldIncoming)?oldIncoming:[])].map(m=>({...m,folder:'Posteingang',category:'Allgemein',starred:false}));}
let folder='Posteingang',tab='Allgemein',active=null,creating=false;
function save(){try{localStorage.setItem('mail-gmx-style-v3',JSON.stringify(emails))}catch{notice('Speichern ist in diesem Browser nicht verfügbar')}}
function notice(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function date(s){const d=new Date(s);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}).format(d):''}
function safeDate(s){const d=new Date(s);return Number.isFinite(d.getTime())?d.getTime():0}
function show(view){for(const id of ['home','detail','editor'])$(id).classList.toggle('hidden',id!==view);window.scrollTo(0,0)}
function render(){const q=($('search').value||'').toLowerCase().trim();$('folderTitle').textContent=folder+'⌄';$('updated').textContent='Aktualisiert: '+new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date());$('tabs').classList.toggle('hidden',folder!=='Posteingang');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const filtered=emails.filter(m=>(folder==='Favoriten'?m.starred:folder==='Ungelesene E-Mails'?!m.read:m.folder===folder)&& (folder!=='Posteingang'||m.category===tab) && [m.from,m.email,m.subject,m.body].some(x=>String(x||'').toLowerCase().includes(q))).sort((a,b)=>safeDate(b.timestamp)-safeDate(a.timestamp));$('list').replaceChildren();if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent='Keine E-Mails vorhanden';$('list').append(e)}for(const m of filtered){const row=document.createElement('div');row.className='mail'+(!m.read?' unread':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(m.from||'?').trim().charAt(0).toUpperCase();const content=document.createElement('div');content.className='mail-content';const top=document.createElement('div');top.className='mail-top';const name=document.createElement('div');name.className='sender';name.textContent=m.from;const time=document.createElement('div');time.className='date';time.textContent=date(m.timestamp);top.append(name,time);const subj=document.createElement('div');subj.className='subject';subj.textContent=m.subject;const prev=document.createElement('div');prev.className='preview';prev.textContent=m.body;content.append(top,subj,prev);const star=document.createElement('button');star.className='star'+(m.starred?' on':'');star.textContent=m.starred?'★':'☆';star.setAttribute('aria-label','Favorit');star.onclick=e=>{e.stopPropagation();m.starred=!m.starred;save();render()};row.append(avatar,content,star);row.onclick=()=>openMail(m.id);$('list').append(row)}renderFolders()}
const folderNames=[['Posteingang','▤'],['Favoriten','☆'],['Ungelesene E-Mails','✉'],['Papierkorb','♜'],['Spamverdacht','⊘'],['Gesendet','➤'],['Entwürfe','✎'],['Postausgang','➤'],['Archiv','▣']];
function renderFolders(){$('folders').replaceChildren();for(const [name,ico] of folderNames){const b=document.createElement('button');b.className='folder'+(folder===name?' active':'');const icon=document.createElement('span');icon.className='fi';icon.textContent=ico;const label=document.createElement('span');label.textContent=name;const count=document.createElement('span');count.className='count';const n=emails.filter(m=>name==='Ungelesene E-Mails'?!m.read:name==='Favoriten'?m.starred:m.folder===name).length;count.textContent=n||'';b.append(icon,label,count);b.onclick=()=>{folder=name;closeDrawer();show('home');render()};$('folders').append(b)}}
function openMail(id){active=emails.find(m=>m.id===id);if(!active)return;active.read=true;save();$('detailSubject').textContent=active.subject;$('detailMeta').textContent=`Von: ${active.from} <${active.email}>\nDatum: ${new Intl.DateTimeFormat('de-DE',{dateStyle:'full',timeStyle:'short'}).format(new Date(active.timestamp))}`;$('detailMeta').style.whiteSpace='pre-line';$('detailBody').textContent=active.body;$('mark').textContent='Als ungelesen markieren';show('detail')}
function openEditor(newMail=false){creating=newMail;if(newMail){active={id:Date.now(),from:'',email:'',subject:'',body:'',timestamp:new Date().toISOString(),read:false,folder:'Entwürfe',category:'Allgemein',starred:false}}if(!active)return;$('editTitle').textContent=newMail?'E-Mail erstellen':'E-Mail bearbeiten';$('editFrom').value=active.from;$('editEmail').value=active.email;$('editSubject').value=active.subject;$('editBody').value=active.body;const d=new Date(active.timestamp);$('editTimestamp').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);show('editor')}
$('editForm').onsubmit=e=>{e.preventDefault();Object.assign(active,{from:$('editFrom').value.trim(),email:$('editEmail').value.trim(),subject:$('editSubject').value.trim(),body:$('editBody').value,timestamp:new Date($('editTimestamp').value).toISOString()});if(creating)emails.push(active);save();openMail(active.id);notice('Gespeichert')};$('edit').onclick=()=>openEditor();$('compose').onclick=()=>openEditor(true);$('cancelEdit').onclick=()=>creating?show('home'):show('detail');$('back').onclick=()=>{show('home');render()};$('mark').onclick=()=>{active.read=!active.read;save();$('mark').textContent=active.read?'Als ungelesen markieren':'Als gelesen markieren'};$('delete').onclick=()=>{active.folder='Papierkorb';save();show('home');render();notice('In den Papierkorb verschoben')};$('searchToggle').onclick=()=>{$('searchbar').classList.toggle('hidden');if(!$('searchbar').classList.contains('hidden'))$('search').focus()};$('search').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});function openDrawer(){$('drawer').classList.remove('hidden');$('shade').classList.remove('hidden')}function closeDrawer(){$('drawer').classList.add('hidden');$('shade').classList.add('hidden')}$('menu').onclick=openDrawer;$('accountBtn').onclick=openDrawer;$('shade').onclick=closeDrawer;$('navMail').onclick=()=>{folder='Posteingang';show('home');render()};for(const id of ['navFiles','navMobile','navNews'])$(id).onclick=()=>notice('Dieser Bereich ist noch nicht eingerichtet');$('settings').onclick=()=>{closeDrawer();notice('Nachrichten werden nur auf diesem Gerät gespeichert')};render();
</script></body></html>
